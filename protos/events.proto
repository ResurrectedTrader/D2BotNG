syntax = "proto3";

package d2bot;

option csharp_namespace = "D2BotNG.Core.Protos";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "profiles.proto";
import "keys.proto";
import "schedules.proto";
import "items.proto";
import "settings.proto";
import "updates.proto";
import "logging.proto";
import "proxies.proto";
import "frameworks.proto";
import "characters.proto";

// Message color codes (values match reference implementation)
enum MessageColor {
  COLOR_DEFAULT = 0;  // Black
  // 1-3 reserved (also map to black in reference)
  COLOR_BLUE = 4;
  COLOR_GREEN = 5;
  COLOR_GOLD = 6;     // DarkGoldenrod
  COLOR_BROWN = 7;    // SaddleBrown
  COLOR_ORANGE = 8;   // DarkOrange
  COLOR_RED = 9;
  COLOR_GRAY = 10;
}

// Event streaming service
service EventService {
  // Single event stream for all real-time updates
  rpc StreamEvents(google.protobuf.Empty) returns (stream Event);

  // Clear messages by source
  rpc ClearMessages(ClearMessagesRequest) returns (google.protobuf.Empty);
}

// Request to clear messages for a specific source
message ClearMessagesRequest {
  string source = 1;  // "System" for system messages, or profile name
}

// Main event wrapper with timestamp and typed payload
message Event {
  google.protobuf.Timestamp timestamp = 1;

  // Case numbers are contiguous and carry no compatibility promise (see CLAUDE.md).
  oneof event {
    // Snapshots
    ProfilesSnapshot profiles_snapshot = 2;
    KeyListsSnapshot key_lists_snapshot = 3;
    SchedulesSnapshot schedules_snapshot = 4;
    ProxiesSnapshot proxies_snapshot = 5;
    CharactersSnapshot characters_snapshot = 6;
    FrameworksSnapshot frameworks_snapshot = 7;

    // Profile events
    ProfileState profile_state = 8;
    Character character_state = 9;

    // Console messages
    Message message = 10;

    // Settings & Updates
    Settings settings = 11;
    UpdateStatus update_status = 12;

    // Item entities
    EntitiesChanged entities_changed = 13;

    // Logging
    LogLevelsSnapshot log_levels_snapshot = 14;

    // Server facts
    ServerInfo server_info = 15;
  }
}

// Facts about the running server that are fixed at build time, so the UI can't infer them
// and they don't belong in Settings (which is user configuration, and persisted). Sent once
// when a client connects.
message ServerInfo {
  string version = 1; // Running app version, e.g. "0.0.21".
  // An Aptabase app key was baked in at build time. Without one the app reports nothing at
  // all, so the UI hides the usage-statistics opt-out rather than offering a dead control.
  bool analytics_available = 2;
}

// Item entities changed event - signals UI to refresh entity list and search
message EntitiesChanged {}

// Log levels snapshot - sent on connect and when levels change
message LogLevelsSnapshot {
  repeated LogLevelEntry levels = 1;
}

// Snapshot messages
message ProfilesSnapshot {
  repeated ProfileState profiles = 1;
}

message KeyListsSnapshot {
  repeated KeyListWithUsage key_lists = 1;
}

message KeyListWithUsage {
  KeyList key_list = 1;
  repeated KeyUsage usage = 2;
}

message KeyUsage {
  string key_name = 1;
  string profile_name = 2;  // Empty if not in use
}

message SchedulesSnapshot {
  repeated Schedule schedules = 1;
}

message ProxiesSnapshot {
  repeated ProxyWithUsage proxies = 1;
}

// Per-proxy usage: which profiles are configured to use it vs currently running with it.
message ProxyWithUsage {
  Proxy proxy = 1;
  repeated string configured_profiles = 2;  // Profiles whose configured proxy is this one (persisted)
  repeated string active_profiles = 3;      // Profiles currently running with this proxy (runtime)
}

message FrameworksSnapshot {
  repeated FrameworkWithUsage frameworks = 1;
}

// Per-framework usage: which profiles are configured to use it vs currently running with it.
message FrameworkWithUsage {
  Framework framework = 1;
  repeated string configured_profiles = 2;  // Profiles whose framework is this one (persisted)
  repeated string active_profiles = 3;       // Profiles currently running with this framework (runtime)
}

message CharactersSnapshot {
  repeated Character characters = 1;
}


// Console message - source is "System" for system messages, or profile name for profile messages
message Message {
  string source = 1;
  string content = 2;
  google.protobuf.Timestamp timestamp = 3;
  MessageColor color = 4;
  optional Item item = 5;
}
