syntax = "proto3";

package d2bot;

option csharp_namespace = "D2BotNG.Core.Protos";

import "google/protobuf/empty.proto";

// Framework management service - mutations return Empty, data arrives via events.
service FrameworkService {
  rpc CreateFramework(Framework) returns (google.protobuf.Empty);
  rpc UpdateFramework(UpdateFrameworkRequest) returns (google.protobuf.Empty);
  rpc DeleteFramework(FrameworkName) returns (google.protobuf.Empty);
}

// A framework bundles the botting system a profile launches with: the D2BS
// directory, inject DLL(s), patch version, health thresholds, cleanup, and
// environment. Profiles reference a framework by name (Profile.framework); the
// profile's own d2_path is the executable that actually gets launched.
message Framework {
  string name = 1;          // Unique identity, referenced by Profile.framework
  string game_directory = 2; // Diablo II install directory. Used to clean up old screenshots/crash logs and as the default folder when browsing for a profile's executable. The launched executable is the profile's own d2_path.
  string d2bs_path = 3;     // Botting-framework directory: contains d2bs.ini, the inject DLL(s), and kolbot/ (what Settings.base_path + "/d2bs" is today)
  repeated string dll_paths = 4; // DLLs to inject, in order. Relative paths resolve against d2bs_path. Empty = ["D2BS.dll"].
  string game_version = 5;  // D2 version for memory patch selection (e.g. "1.14d"). Empty = "1.14d".
  int32 screenshot_retention_days = 6; // Auto-delete Screenshot*.jpg in this framework's game directory older than N days. 0 = disabled.
  int32 crash_log_retention_days = 7;  // Auto-delete BlizzardError subdirectories in this framework's game directory older than N days. 0 = disabled.

  // Reads the manager-written d2bs.ini (account, character, entry script). Optional;
  // absent = true. False = the manager won't write d2bs.ini for this framework's profiles.
  optional bool uses_ini = 8;

  // Health monitoring & crash recovery, per framework. Optional; absent = the built-in
  // default shown in parentheses. Disable a watchdog by setting its timeout to 0.
  optional int32 heartbeat_timeout_seconds = 9;    // Seconds without a heartbeat before a miss. 0 = heartbeat watchdog disabled (won't restart a silent game). (30)
  optional int32 max_missed_heartbeats = 10;       // Consecutive missed heartbeats before restart. (3)
  optional int32 max_crash_retries = 11;           // Restart attempts after a crash before giving up and disabling the schedule. (5)
  optional int32 unresponsive_timeout_seconds = 12; // Seconds the game window may be continuously hung (OS "not responding") before restart. 0 = disabled. (30)

  // Extra environment variables for the launched game process, merged over (and
  // overriding) the manager's own environment.
  map<string, string> environment = 13;
}

message UpdateFrameworkRequest {
  Framework framework = 1;
  optional string original_name = 2;  // Set when renaming an existing framework
}

message FrameworkName {
  string name = 1;
}
