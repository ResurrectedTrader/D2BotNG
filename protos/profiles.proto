syntax = "proto3";

package d2bot;

option csharp_namespace = "D2BotNG.Core.Protos";

import "google/protobuf/empty.proto";
import "common.proto";

// Profile service
service ProfileService {
  // CRUD operations - mutations return Empty, data arrives via events
  rpc Create(Profile) returns (google.protobuf.Empty);
  rpc Update(UpdateProfileRequest) returns (google.protobuf.Empty);
  rpc Delete(ProfileNames) returns (google.protobuf.Empty);

  // Profile actions (accepts list of profile names)
  rpc Start(ProfileNames) returns (google.protobuf.Empty);
  rpc Stop(ProfileNames) returns (google.protobuf.Empty);

  // Window control (accepts list of profile names)
  rpc ShowWindow(ProfileNames) returns (google.protobuf.Empty);
  rpc HideWindow(ProfileNames) returns (google.protobuf.Empty);

  // Stats and keys (accepts list of profile names)
  rpc ResetStats(ProfileNames) returns (google.protobuf.Empty);
  rpc TriggerMule(ProfileNames) returns (google.protobuf.Empty);
  rpc RotateKey(ProfileNames) returns (google.protobuf.Empty);
  rpc ReleaseKey(ProfileNames) returns (google.protobuf.Empty);
  rpc EnableSchedule(ProfileNames) returns (google.protobuf.Empty);
  rpc DisableSchedule(ProfileNames) returns (google.protobuf.Empty);

  // Reordering
  rpc Reorder(ReorderProfileRequest) returns (google.protobuf.Empty);
}

// Field numbers are contiguous and carry no compatibility promise (persistence is
// by field name; see CLAUDE.md).
message Profile {
  // Basic Info
  string name = 1;
  string group = 2;
  string framework = 3;         // Name of the Framework (from the Frameworks tab) this profile launches with.
  string d2_path = 4;           // Full path to the game executable this profile launches (required).
  string parameters = 5;        // Command line params (e.g., "-w -sleepy -ftj")
  map<string, string> environment = 6; // Extra environment variables for this profile's game process, merged over (overriding) the framework's environment.
  bool visible = 7;             // Window visibility on start
  optional WindowLocation window_location = 8;

  // Network
  string proxy = 9;             // Address of the proxy (from the Proxies tab) this profile uses. Empty = direct connection.

  // Account Settings
  string character = 10;
  Realm realm = 11;
  string account = 12;
  string password = 13;

  // Game Settings
  Difficulty difficulty = 14;
  GameMode mode = 15;
  string game_name = 16;
  string game_pass = 17;

  // Script Settings
  string entry_script = 18;
  string info_tag = 19;         // Info tag for scripts

  // Key Management
  string key_list = 20;
  uint32 runs_per_key = 21;
  bool switch_keys_on_restart = 22;

  // Schedule
  string schedule = 23;
  bool schedule_enabled = 24;

  // Statistics (persisted)
  uint32 runs = 25;
  uint32 chickens = 26;
  uint32 deaths = 27;
  uint32 crashes = 28;
  uint32 restarts = 29;
  uint32 key_runs = 30;

  // Discord webhooks (per-profile)
  repeated DiscordWebhook discord_webhooks = 31;
}

message DiscordWebhook {
  string url = 1;
  bool post_items = 2;     // printToItemLog (renders item PNG, attaches to message)
  bool post_console = 3;   // printToConsole
  bool post_announce = 4;  // postToIRC (legacy "announce" hooktype)
}

message WindowLocation {
  int32 x = 1;
  int32 y = 2;
}

message ProfileState {
  string profile_name = 1;
  RunState state = 2;
  string status = 3;  // Human-readable status text (state description or error message)

  string key_name = 4;
  string proxy_name = 5;  // Proxy currently in use by the running instance (runtime)

  // Window visibility
  bool window_visible = 6;

  // Full profile data. Always set in snapshots. In events, set only when persisted
  // profile fields changed (e.g. stats, key rotation, settings). When absent in
  // events, clients should retain their cached profile data keyed by profile_name.
  optional Profile profile = 7;
}

message ReorderProfileRequest {
  repeated string profile_names = 1;
  int32 new_index = 2;
  optional string new_group = 3;
}

message UpdateProfileRequest {
  Profile profile = 1;
  optional string original_name = 2;  // Used when renaming - if set, looks up by this name instead of profile.name
}
