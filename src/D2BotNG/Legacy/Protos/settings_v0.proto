syntax = "proto3";

package d2bot.legacy;

option csharp_namespace = "D2BotNG.Core.Protos.Legacy";

// Archived pre-frameworks settings shape, kept ONLY for migrating old d2botng.json
// files. The game/engine blocks moved onto Framework; SettingsMigrator parses an old
// file into this message (field-tolerant, so all the still-current keys are ignored)
// to recover those values.
//
// Deliberately lives OUTSIDE protos/ so it is compiled for the C# backend only and
// never reaches the frontend's buf-generated types. Field numbers are irrelevant here
// (protobuf-JSON matches by name); the field NAMES must match the old file's keys.
message SettingsV0 {
  GameSettingsV0 game = 1;
  EngineSettingsV0 engine = 2;
}

message GameSettingsV0 {
  string d2_install_path = 1;
  string game_version = 2;
  int32 screenshot_retention_days = 3;
  int32 crash_log_retention_days = 4;
}

message EngineSettingsV0 {
  int32 heartbeat_timeout_seconds = 1;
  int32 max_missed_heartbeats = 2;
  int32 max_crash_retries = 3;
  int32 unresponsive_timeout_seconds = 4;
}
